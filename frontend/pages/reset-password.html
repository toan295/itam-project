<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đặt lại mật khẩu - EAIMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../shared/theme.css" rel="stylesheet">
  <style>
    body { background: var(--eaims-bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .reset-wrap { width: 100%; max-width: 400px; padding: 24px; }
    .reset-icon {
      width: 56px; height: 56px; border-radius: 16px;
      background: var(--eaims-primary-light); color: var(--eaims-primary);
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 16px;
    }
    .input-icon-group { position: relative; }
    .input-icon-group i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--eaims-text-muted); }
    .input-icon-group .form-control { padding-left: 38px; }
  </style>
</head>
<body>
  <div class="reset-wrap">
    <div class="eaims-card">
      <div class="card-body p-4">
        <div class="reset-icon"><i class="bi bi-shield-lock"></i></div>
        <h4 class="fw-bold text-center mb-1">Đặt lại mật khẩu</h4>
        <p class="text-muted text-center small mb-4">Nhập mật khẩu mới cho tài khoản của bạn.</p>

        <div id="formError" class="alert alert-danger d-none py-2"></div>
        <div id="formSuccess" class="alert alert-success d-none py-2"></div>

        <form id="resetForm">
          <div class="mb-3">
            <label class="form-label">Mật khẩu mới</label>
            <div class="input-icon-group">
              <i class="bi bi-lock"></i>
              <input type="password" class="form-control" id="newPassword" required minlength="6" maxlength="100">
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Xác nhận mật khẩu mới</label>
            <div class="input-icon-group">
              <i class="bi bi-lock-fill"></i>
              <input type="password" class="form-control" id="confirmPassword" required minlength="6" maxlength="100">
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2" id="submitBtn">Đặt lại mật khẩu</button>
        </form>

        <div class="text-center mt-3">
          <a href="login.html" class="small"><i class="bi bi-arrow-left"></i> Quay lại đăng nhập</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/api-client.js"></script>
  <script src="../assets/js/reset-password.js"></script>
</body>
</html>
