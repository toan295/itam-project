<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phần mềm & Giấy phép - EAIMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../shared/theme.css" rel="stylesheet">
</head>
<body>
  <div class="eaims-shell">
    <div id="appNav"></div>

    <main class="eaims-main">
      <div class="page-header">
        <div>
          <h1>Phần mềm & Giấy phép</h1>
          <p>Chỉ tài khoản role Admin IT được truy cập module này.</p>
        </div>
        <button class="btn btn-primary" id="openCreateBtn"><i class="bi bi-plus-lg"></i> Thêm license</button>
      </div>

      <div id="forbiddenAlert" class="alert alert-warning d-none"></div>
      <div id="warningBanner" class="alert alert-warning d-none"></div>
      <div id="errorAlert" class="alert alert-danger d-none"></div>

      <div id="licenseContent">
        <div class="eaims-card mb-3">
          <div class="card-body py-3">
            <form id="searchForm" class="row g-2 align-items-end">
              <div class="col-auto">
                <label class="form-label">Tìm kiếm</label>
                <input class="form-control" id="searchText" placeholder="Tên phần mềm hoặc LicenseKey" style="width: 260px">
              </div>
              <div class="col-auto"><button class="btn btn-primary" type="submit"><i class="bi bi-search"></i> Tìm</button></div>
            </form>
          </div>
        </div>

        <div class="eaims-table-wrap">
          <div class="table-responsive">
            <table class="eaims-table">
              <thead><tr>
                <th>Phần mềm</th><th>License Key</th><th>Hết hạn</th><th>Sử dụng</th><th>Trạng thái</th><th class="text-end">Thao tác</th>
              </tr></thead>
              <tbody id="licenseTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Tạo / Sửa license -->
  <div class="modal fade" id="licenseModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="licenseForm">
          <div class="modal-header">
            <h5 class="modal-title" id="licenseModalTitle">Thêm license</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="licenseModalError" class="alert alert-danger d-none py-2"></div>
            <input type="hidden" id="licenseId">
            <div class="mb-2">
              <label class="form-label">Tên phần mềm</label>
              <input class="form-control" id="softwareName" required maxlength="150">
            </div>
            <div class="mb-2">
              <label class="form-label">License Key</label>
              <input class="form-control" id="licenseKey" required maxlength="255">
            </div>
            <div class="row">
              <div class="col mb-2">
                <label class="form-label">Ngày hết hạn</label>
                <input type="date" class="form-control" id="expiryDate" required>
              </div>
              <div class="col mb-2">
                <label class="form-label">Số lượng tối đa (MaxUsage)</label>
                <input type="number" min="1" class="form-control" id="maxUsage" required>
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label">Ghi chú</label>
              <textarea class="form-control" id="notes" maxlength="500"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
            <button type="submit" class="btn btn-primary">Lưu</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Gán / Gỡ license cho tài sản -->
  <div class="modal fade" id="assignModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="assignForm">
          <div class="modal-header">
            <h5 class="modal-title" id="assignModalTitle">Gán license cho tài sản</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="assignModalError" class="alert alert-danger d-none py-2"></div>
            <p class="text-muted small" id="assignHelpText"></p>
            <label class="form-label">Tài sản</label>
            <select class="form-select" id="assignAssetId" required></select>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
            <button type="submit" class="btn btn-primary" id="assignSubmitBtn">Gán</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/api-client.js"></script>
  <script src="../shared/nav.js"></script>
  <script src="../assets/js/software-licenses.js"></script>
</body>
</html>
