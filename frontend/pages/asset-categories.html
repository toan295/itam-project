<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loại tài sản - EAIMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../shared/theme.css" rel="stylesheet">
</head>
<body>
  <div class="eaims-shell">
    <div id="appNav"></div>

    <main class="eaims-main">
      <div class="page-header">
        <div>
          <h1>Loại tài sản</h1>
          <p>Danh mục dùng chung cho toàn hệ thống. Chỉ Admin IT được thêm/sửa/xoá.</p>
        </div>
        <button class="btn btn-primary" id="openCreateBtn"><i class="bi bi-plus-lg"></i> Thêm loại tài sản</button>
      </div>

      <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

      <div class="eaims-table-wrap">
        <div class="table-responsive">
          <table class="eaims-table">
            <thead><tr><th style="width:80px">STT</th><th>Tên loại tài sản</th><th class="text-end">Thao tác</th></tr></thead>
            <tbody id="categoryTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="categoryModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="categoryForm">
          <div class="modal-header">
            <h5 class="modal-title" id="categoryModalTitle">Thêm loại tài sản</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="modalError" class="alert alert-danger d-none py-2"></div>
            <input type="hidden" id="categoryId">
            <label class="form-label">Tên loại tài sản</label>
            <input class="form-control" id="categoryName" required maxlength="100">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
            <button type="submit" class="btn btn-primary">Lưu</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/api-client.js"></script>
  <script src="../shared/nav.js"></script>
  <script src="../assets/js/asset-categories.js"></script>
</body>
</html>
