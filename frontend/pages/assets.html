<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quản lý tài sản CNTT - EAIMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../shared/theme.css" rel="stylesheet">
</head>
<body>
  <div class="eaims-shell">
    <div id="appNav"></div>

    <main class="eaims-main">
      <div class="page-header">
        <div>
          <h1>Quản lý tài sản CNTT</h1>
          <p>Danh sách, tìm kiếm/lọc nâng cao, thêm/sửa/thanh lý tài sản.</p>
        </div>
        <button class="btn btn-primary" id="openCreateBtn"><i class="bi bi-plus-lg"></i> Thêm tài sản</button>
      </div>

      <div class="eaims-card mb-3">
        <div class="card-body py-3">
          <form id="filterForm" class="row g-2 align-items-end">
            <div class="col-auto">
              <label class="form-label">Từ khoá</label>
              <input class="form-control" id="keyword" placeholder="Tên hoặc mã tài sản">
            </div>
            <div class="col-auto">
              <label class="form-label">Trạng thái</label>
              <select class="form-select" id="status">
                <option value="">-- Tất cả --</option>
                <option value="InUse">Đang dùng</option>
                <option value="Maintenance">Bảo trì</option>
                <option value="Broken">Hỏng</option>
                <option value="Disposed">Đã thanh lý</option>
              </select>
            </div>
            <div class="col-auto">
              <label class="form-label">Bảo hành</label>
              <select class="form-select" id="warrantyStatus">
                <option value="">-- Tất cả --</option>
                <option value="Valid">Còn bảo hành</option>
                <option value="Expired">Hết bảo hành</option>
              </select>
            </div>
            <div class="col-auto">
              <label class="form-label">Phòng ban</label>
              <select class="form-select" id="departmentId" style="width: 170px">
                <option value="">-- Tất cả --</option>
              </select>
            </div>
            <div class="col-auto">
              <label class="form-label">Loại tài sản</label>
              <select class="form-select" id="categoryId" style="width: 170px">
                <option value="">-- Tất cả --</option>
              </select>
            </div>
            <div class="col-auto">
              <label class="form-label">Năm mua</label>
              <input type="number" min="1900" class="form-control" id="purchaseYear" style="width: 110px">
            </div>
            <div class="col-auto"><button class="btn btn-primary" type="submit"><i class="bi bi-search"></i> Lọc</button></div>
            <div class="col-auto"><button class="btn btn-outline-secondary" type="button" id="resetFilterBtn">Xoá lọc</button></div>
          </form>
        </div>
      </div>

      <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

      <div class="eaims-table-wrap">
        <div class="table-responsive">
          <table class="eaims-table">
            <thead><tr>
              <th>Mã TS</th><th>Tên</th><th>Loại</th><th>Phòng ban</th><th>Trạng thái</th><th>Bảo hành</th><th></th>
            </tr></thead>
            <tbody id="assetTableBody"></tbody>
          </table>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3">
        <span class="text-muted small" id="totalItemsLabel"></span>
        <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
      </div>
    </main>
  </div>

  <!-- Modal Tạo / Sửa tài sản -->
  <div class="modal fade" id="assetModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="assetForm">
          <div class="modal-header">
            <h5 class="modal-title" id="assetModalTitle">Thêm tài sản</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="modalError" class="alert alert-danger d-none py-2"></div>
            <input type="hidden" id="assetId">
            <div class="mb-2">
              <label class="form-label">Mã tài sản</label>
              <input class="form-control" id="assetCode" required maxlength="50">
            </div>
            <div class="mb-2">
              <label class="form-label">Tên tài sản</label>
              <input class="form-control" id="assetName" required maxlength="150">
            </div>
            <div class="row">
              <div class="col mb-2">
                <label class="form-label">Loại tài sản</label>
                <select class="form-select" id="formCategoryId" required></select>
              </div>
              <div class="col mb-2">
                <label class="form-label">Phòng ban</label>
                <select class="form-select" id="formDepartmentId" required></select>
              </div>
            </div>
            <div class="mb-2" id="formStatusWrapper" style="display:none">
              <label class="form-label">Trạng thái</label>
              <select class="form-select" id="formStatus">
                <option value="InUse">Đang dùng</option>
                <option value="Maintenance">Bảo trì</option>
                <option value="Broken">Hỏng</option>
                <option value="Disposed">Đã thanh lý</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Số serial</label>
              <input class="form-control" id="serialNumber" maxlength="100">
            </div>
            <div class="mb-2">
              <label class="form-label">Cấu hình</label>
              <input class="form-control" id="specification" maxlength="500">
            </div>
            <div class="mb-2">
              <label class="form-label">Hệ điều hành</label>
              <input class="form-control" id="operatingSystem" maxlength="100">
            </div>
            <div class="row">
              <div class="col mb-2">
                <label class="form-label">Ngày mua</label>
                <input type="date" class="form-control" id="purchaseDate">
              </div>
              <div class="col mb-2">
                <label class="form-label">Hạn bảo hành</label>
                <input type="date" class="form-control" id="warrantyExpiry">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
            <button type="submit" class="btn btn-primary">Lưu</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/api-client.js"></script>
  <script src="../shared/nav.js"></script>
  <script src="../assets/js/assets.js"></script>
</body>
</html>
