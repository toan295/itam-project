<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quản lý tài sản CNTT - EAIMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h3 class="mb-3">Quản lý tài sản CNTT</h3>

    <!-- Tạm thời: chưa có trang đăng nhập chung (sẽ làm ở module Dashboard), dán token JWT vào đây để test. -->
    <div class="card mb-3">
      <div class="card-body py-2">
        <div class="row g-2 align-items-center">
          <div class="col-auto"><label class="col-form-label">Bearer token (tạm thời)</label></div>
          <div class="col"><input class="form-control form-control-sm" id="tokenInput" placeholder="Dán JWT token sau khi đăng nhập qua /api/v1/auth/login"></div>
          <div class="col-auto"><button class="btn btn-sm btn-outline-secondary" id="saveTokenBtn">Lưu token</button></div>
        </div>
      </div>
    </div>

    <form id="filterForm" class="row g-2 mb-3">
      <div class="col-auto"><input class="form-control" id="keyword" placeholder="Tìm theo tên/mã tài sản"></div>
      <div class="col-auto">
        <select class="form-select" id="status">
          <option value="">-- Trạng thái --</option>
          <option value="InUse">Đang dùng</option>
          <option value="Maintenance">Bảo trì</option>
          <option value="Broken">Hỏng</option>
          <option value="Disposed">Đã thanh lý</option>
        </select>
      </div>
      <div class="col-auto">
        <select class="form-select" id="warrantyStatus">
          <option value="">-- Bảo hành --</option>
          <option value="Valid">Còn bảo hành</option>
          <option value="Expired">Hết bảo hành</option>
        </select>
      </div>
      <div class="col-auto">
        <select class="form-select" id="departmentId" style="width: 170px">
          <option value="">-- Phòng ban --</option>
        </select>
      </div>
      <div class="col-auto">
        <select class="form-select" id="categoryId" style="width: 170px">
          <option value="">-- Loại tài sản --</option>
        </select>
      </div>
      <div class="col-auto"><input type="number" min="1900" class="form-control" id="purchaseYear" placeholder="Năm mua" style="width: 110px"></div>
      <div class="col-auto"><button class="btn btn-primary" type="submit">Lọc</button></div>
      <div class="col-auto"><button class="btn btn-outline-secondary" type="button" id="resetFilterBtn">Xoá lọc</button></div>
    </form>

    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

    <div class="table-responsive">
      <table class="table table-bordered bg-white align-middle">
        <thead><tr>
          <th>Mã TS</th><th>Tên</th><th>Loại</th><th>Phòng ban</th><th>Trạng thái</th><th>Bảo hành</th><th></th>
        </tr></thead>
        <tbody id="assetTableBody"></tbody>
      </table>
    </div>
    <div class="d-flex justify-content-between align-items-center">
      <span class="text-muted small" id="totalItemsLabel"></span>
      <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
    </div>
  </div>

  <script src="../shared/api-client.js"></script>
  <script src="../assets/js/assets.js"></script>
</body>
</html>
