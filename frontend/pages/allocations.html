<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phân bổ & Thu hồi tài sản - EAIMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../shared/theme.css" rel="stylesheet">
</head>
<body>
  <div class="eaims-shell">
    <div id="appNav"></div>

    <main class="eaims-main">
      <div class="page-header">
        <div>
          <h1>Phân bổ & Thu hồi tài sản</h1>
          <p>Theo dõi lịch sử bàn giao, thu hồi và cảnh báo tài sản quá hạn bảo trì.</p>
        </div>
        <button class="btn btn-primary" id="openCreateBtn"><i class="bi bi-box-arrow-up-right"></i> Phân bổ mới</button>
      </div>

      <div id="overdueSection" class="mb-3 d-none">
        <div class="alert alert-warning mb-0">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <strong><i class="bi bi-exclamation-triangle"></i> Cảnh báo quá hạn bảo trì</strong>
            <span class="small" id="overdueCount"></span>
          </div>
          <div id="overdueList" class="small"></div>
        </div>
      </div>

      <div class="eaims-card mb-3">
        <div class="card-body py-3">
          <form id="filterForm" class="row g-2 align-items-end">
            <div class="col-auto">
              <label class="form-label">Phòng ban</label>
              <select class="form-select" id="departmentId" style="width: 190px">
                <option value="">-- Tất cả --</option>
              </select>
            </div>
            <div class="col-auto">
              <label class="form-label">Trạng thái</label>
              <select class="form-select" id="status">
                <option value="">-- Tất cả --</option>
                <option value="Allocated">Đang phân bổ</option>
                <option value="Returned">Đã thu hồi</option>
              </select>
            </div>
            <div class="col-auto"><button class="btn btn-primary" type="submit"><i class="bi bi-search"></i> Lọc</button></div>
            <div class="col-auto"><button class="btn btn-outline-secondary" type="button" id="resetFilterBtn">Xoá lọc</button></div>
          </form>
        </div>
      </div>

      <div id="errorAlert" class="alert alert-danger d-none"></div>

      <div class="eaims-table-wrap">
        <div class="table-responsive">
          <table class="eaims-table">
            <thead><tr>
              <th>Tài sản</th><th>Phòng ban</th><th>Người nhận</th><th>Ngày giao</th><th>Ngày thu hồi</th><th>Trạng thái</th><th class="text-end">Thao tác</th>
            </tr></thead>
            <tbody id="allocationTableBody"></tbody>
          </table>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3">
        <span class="text-muted small" id="totalItemsLabel"></span>
        <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
      </div>
    </main>
  </div>

  <!-- Modal phân bổ mới -->
  <div class="modal fade" id="createAllocationModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="createAllocationForm">
          <div class="modal-header">
            <h5 class="modal-title">Phân bổ tài sản mới</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="createModalError" class="alert alert-danger d-none py-2"></div>
            <div class="mb-2">
              <label class="form-label">Tài sản</label>
              <input class="form-control" id="assetSearchInput" list="assetSuggestions" autocomplete="off" placeholder="Nhập mã hoặc tên tài sản" required>
              <datalist id="assetSuggestions"></datalist>
              <input type="hidden" id="selectedAssetId">
              <div class="form-text">Chỉ tìm các tài sản đang ở trạng thái InUse.</div>
            </div>
            <div class="mb-2">
              <label class="form-label">Phòng ban</label>
              <select class="form-select" id="allocationDepartmentId" required></select>
            </div>
            <div class="mb-2">
              <label class="form-label">Người nhận</label>
              <input class="form-control" id="recipientName" required maxlength="100">
            </div>
            <div class="mb-2">
              <label class="form-label">Ngày giao</label>
              <input type="date" class="form-control" id="allocatedDate" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Ghi chú bàn giao</label>
              <textarea class="form-control" id="handoverNote" maxlength="500"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
            <button type="submit" class="btn btn-primary">Phân bổ</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal thu hồi -->
  <div class="modal fade" id="returnAllocationModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="returnAllocationForm">
          <div class="modal-header">
            <h5 class="modal-title">Thu hồi tài sản</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="returnModalError" class="alert alert-danger d-none py-2"></div>
            <input type="hidden" id="returnAllocationId">
            <div class="mb-2">
              <label class="form-label">Ngày thu hồi</label>
              <input type="date" class="form-control" id="returnedDate" required>
            </div>
            <div class="mb-2">
              <label class="form-label d-block">Tình trạng khi nhận lại</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="returnCondition" id="conditionGood" value="Good" checked>
                <label class="form-check-label" for="conditionGood">Tốt (Good)</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="returnCondition" id="conditionDamaged" value="Damaged">
                <label class="form-check-label" for="conditionDamaged">Hỏng (Damaged)</label>
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label">Ghi chú thu hồi</label>
              <textarea class="form-control" id="returnNote" maxlength="500"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
            <button type="submit" class="btn btn-primary">Xác nhận thu hồi</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/api-client.js"></script>
  <script src="../shared/nav.js"></script>
  <script src="../assets/js/allocations.js"></script>
</body>
</html>
