<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phân quyền - EAIMS</title>
  <style>
    .perm-table th, .perm-table td { text-align: center; vertical-align: middle; }
    .perm-table th:first-child, .perm-table td:first-child { text-align: left; min-width: 260px; }
    .perm-table .group-row td { background: #f4f6fb; font-weight: 700; font-size: .78rem; text-transform: uppercase;
      letter-spacing: .04em; color: var(--eaims-text-muted); text-align: left; }
    .perm-table .role-col { min-width: 130px; }
    .perm-table .role-col.locked { background: #fafbfe; }
    .perm-table input[type=checkbox] { width: 1.15rem; height: 1.15rem; cursor: pointer; }
    .perm-table input[type=checkbox]:disabled { cursor: not-allowed; }
    .perm-cell { position: relative; display: inline-block; }
    .perm-cell.changed::after { content: ""; position: absolute; top: -4px; right: -8px; width: 7px; height: 7px;
      border-radius: 50%; background: #f59e0b; }
    .perm-cell.off-default::before { content: ""; position: absolute; bottom: -4px; right: -8px; width: 7px; height: 7px;
      border-radius: 50%; background: #6366f1; }
    .perm-desc { font-size: .78rem; color: var(--eaims-text-muted); font-weight: 400; }
    .save-bar { position: sticky; bottom: 12px; z-index: 5; }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../shared/theme.css?v=20261119" rel="stylesheet">
</head>
<body>
  <div class="eaims-shell">
    <div id="appNav"></div>

    <main class="eaims-main">
      <div class="page-header">
        <div>
          <h1>Phân quyền</h1>
          <p>Chọn chức năng mà mỗi vai trò được phép thực hiện. Quyết định vai trò nào được dùng chức năng nào. Sau khi lưu, có hiệu lực ngay.</p>
        </div>
      </div>

      <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
      <div id="infoAlert" class="alert alert-success d-none" role="alert"></div>

      <div class="small mb-2">
        <span class="me-3"><span class="badge text-bg-warning">&nbsp;</span> chưa lưu</span>
        <span><span class="badge" style="background:#6366f1">&nbsp;</span> khác mặc định</span>
      </div>

      <div class="eaims-table-wrap">
        <div class="table-responsive">
          <table class="eaims-table perm-table">
            <thead id="matrixHead"></thead>
            <tbody id="matrixBody"></tbody>
          </table>
        </div>
      </div>

      <div class="save-bar mt-3 d-none" id="saveBar">
        <div class="eaims-card"><div class="card-body py-2 d-flex flex-wrap align-items-center gap-2">
          <span class="me-auto" id="dirtySummary"></span>
          <button class="btn btn-outline-secondary" id="discardBtn" type="button">Huỷ thay đổi</button>
          <button class="btn btn-primary" id="saveBtn" type="button"><i class="bi bi-check2"></i> Lưu thay đổi</button>
        </div></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/api-client.js?v=20261119"></script>
  <script src="../shared/nav.js?v=20261119"></script>
  <script src="../assets/js/permissions.js?v=20261119"></script>
</body>
</html>
