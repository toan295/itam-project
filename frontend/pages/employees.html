<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nhân viên - EAIMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../shared/theme.css" rel="stylesheet">
</head>
<body>
  <div class="eaims-shell">
    <div id="appNav"></div>

    <main class="eaims-main">
      <div class="page-header">
        <div>
          <h1>Danh mục nhân viên</h1>
          <p>Người nhận tài sản khi phân bổ được chọn từ danh sách này (họ tên, chức danh, phòng ban thống nhất để tra cứu và in biên bản).</p>
        </div>
        <button class="btn btn-primary" id="openCreateBtn"><i class="bi bi-person-plus"></i> Thêm nhân viên</button>
      </div>

      <div class="eaims-card mb-3">
        <div class="card-body py-3">
          <form id="filterForm" class="row g-2 align-items-end">
            <div class="col-auto">
              <label class="form-label">Tìm kiếm</label>
              <input class="form-control" id="keyword" placeholder="Tên, mã NV hoặc chức danh" style="width: 240px">
            </div>
            <div class="col-auto" id="departmentFilterWrapper">
              <label class="form-label">Phòng ban</label>
              <select class="form-select" id="departmentId" style="width: 190px"><option value="">-- Tất cả --</option></select>
            </div>
            <div class="col-auto">
              <label class="form-label">Trạng thái</label>
              <select class="form-select" id="isActive">
                <option value="">-- Tất cả --</option>
                <option value="true">Đang hoạt động</option>
                <option value="false">Ngừng hoạt động</option>
              </select>
            </div>
            <div class="col-auto"><button class="btn btn-primary" type="submit"><i class="bi bi-search"></i> Lọc</button></div>
            <div class="col-auto"><button class="btn btn-outline-secondary" type="button" id="resetFilterBtn">Xoá lọc</button></div>
          </form>
        </div>
      </div>

      <div id="errorAlert" class="alert alert-danger d-none"></div>

      <div class="eaims-table-wrap">
        <div class="table-responsive">
          <table class="eaims-table">
            <thead><tr>
              <th>Mã NV</th><th>Họ tên</th><th>Chức danh</th><th>Phòng ban</th><th>Trạng thái</th><th class="text-end">Thao tác</th>
            </tr></thead>
            <tbody id="employeeTableBody"></tbody>
          </table>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3">
        <span class="text-muted small" id="totalItemsLabel"></span>
        <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
      </div>
    </main>
  </div>

  <!-- Modal Thêm / Sửa nhân viên -->
  <div class="modal fade" id="employeeModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="employeeForm">
          <div class="modal-header">
            <h5 class="modal-title" id="employeeModalTitle">Thêm nhân viên</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="employeeModalError" class="alert alert-danger d-none py-2"></div>
            <input type="hidden" id="employeeId">
            <div class="mb-2">
              <label class="form-label">Họ tên</label>
              <input class="form-control" id="employeeFullName" required maxlength="100" placeholder="Nguyễn Văn An">
              <div class="form-text">Hệ thống tự chuẩn hoá khoảng trắng và viết hoa chữ cái đầu mỗi từ.</div>
            </div>
            <div class="mb-2">
              <label class="form-label">Chức danh</label>
              <input class="form-control" id="employeePosition" maxlength="100" placeholder="Kế toán tổng hợp">
            </div>
            <div class="mb-2">
              <label class="form-label">Phòng ban (bộ phận)</label>
              <select class="form-select" id="employeeDepartmentId" required></select>
            </div>
            <div class="form-check mb-2" id="employeeActiveWrapper">
              <input class="form-check-input" type="checkbox" id="employeeIsActive" checked>
              <label class="form-check-label" for="employeeIsActive">Đang hoạt động</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
            <button type="submit" class="btn btn-primary">Lưu</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/api-client.js"></script>
  <script src="../shared/nav.js"></script>
  <script src="../assets/js/employees.js"></script>
</body>
</html>
