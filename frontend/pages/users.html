<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Người dùng - EAIMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../shared/theme.css" rel="stylesheet">
</head>
<body>
  <div class="eaims-shell">
    <div id="appNav"></div>

    <main class="eaims-main">
      <div class="page-header">
        <div>
          <h1>Quản lý người dùng</h1>
          <p>Tạo/sửa tài khoản, gán vai trò & phòng ban, khoá tài khoản. Chỉ Admin IT.</p>
        </div>
        <button class="btn btn-primary" id="openCreateBtn"><i class="bi bi-person-plus"></i> Thêm người dùng</button>
      </div>

      <div id="forbiddenAlert" class="alert alert-warning d-none"></div>
      <div id="errorAlert" class="alert alert-danger d-none"></div>
      <div id="setupLinkResult" class="d-none"></div>

      <div id="usersContent">
        <div class="eaims-table-wrap">
          <div class="table-responsive">
            <table class="eaims-table">
              <thead><tr>
                <th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Phòng ban</th><th>Trạng thái</th><th class="text-end">Thao tác</th>
              </tr></thead>
              <tbody id="userTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Tạo / Sửa người dùng -->
  <div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="userForm">
          <div class="modal-header">
            <h5 class="modal-title" id="userModalTitle">Thêm người dùng</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="userModalError" class="alert alert-danger d-none py-2"></div>
            <input type="hidden" id="userId">
            <div class="mb-2">
              <label class="form-label">Họ tên</label>
              <input class="form-control" id="fullName" required maxlength="100">
            </div>
            <div class="mb-2">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required maxlength="150">
            </div>
            <div class="row">
              <div class="col mb-2">
                <label class="form-label">Vai trò</label>
                <select class="form-select" id="roleId" required></select>
              </div>
              <div class="col mb-2">
                <label class="form-label">Phòng ban</label>
                <select class="form-select" id="departmentId" required></select>
              </div>
            </div>
            <div class="mb-2 d-none" id="isActiveWrapper">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="isActive" checked>
                <label class="form-check-label" for="isActive">Tài khoản đang hoạt động (bỏ tick = khoá)</label>
              </div>
            </div>
            <p class="text-muted small mb-0" id="createHint">
              <i class="bi bi-info-circle"></i> Không cần đặt mật khẩu — hệ thống sẽ cấp liên kết để người dùng tự thiết lập mật khẩu đầu tiên.
            </p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
            <button type="submit" class="btn btn-primary">Lưu</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/api-client.js"></script>
  <script src="../shared/nav.js"></script>
  <script src="../assets/js/users.js"></script>
</body>
</html>
