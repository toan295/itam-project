<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phòng ban - EAIMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../shared/theme.css" rel="stylesheet">
</head>
<body>
  <div class="eaims-shell">
    <div id="appNav"></div>

    <main class="eaims-main">
      <div class="page-header">
        <div>
          <h1>Phòng ban</h1>
          <p>Danh mục dùng chung cho toàn hệ thống. Chỉ Admin IT được thêm/sửa/xoá phòng ban; không xoá được phòng ban đang có người dùng hoặc tài sản.</p>
        </div>
        <button class="btn btn-primary" id="openCreateBtn"><i class="bi bi-plus-lg"></i> Thêm phòng ban</button>
      </div>

      <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

      <div class="eaims-table-wrap">
        <div class="table-responsive">
          <table class="eaims-table">
            <thead><tr><th style="width:80px">STT</th><th>Tên phòng ban</th><th>Mô tả</th><th class="text-end">Thao tác</th></tr></thead>
            <tbody id="departmentTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="departmentModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="departmentForm">
          <div class="modal-header">
            <h5 class="modal-title" id="departmentModalTitle">Thêm phòng ban</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="modalError" class="alert alert-danger d-none py-2"></div>
            <input type="hidden" id="departmentId">
            <div class="mb-2">
              <label class="form-label">Tên phòng ban</label>
              <input class="form-control" id="departmentName" required maxlength="100">
            </div>
            <div class="mb-2">
              <label class="form-label">Mô tả</label>
              <textarea class="form-control" id="departmentDescription" maxlength="255"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
            <button type="submit" class="btn btn-primary">Lưu</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/api-client.js"></script>
  <script src="../shared/nav.js"></script>
  <script src="../assets/js/departments.js"></script>
</body>
</html>
